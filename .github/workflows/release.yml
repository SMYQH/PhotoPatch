name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install MinGW-w64 Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64

      - name: Build Project
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Run Regression Tests
        run: |
          chmod +x tests/test_pe_dependencies.sh
          ./tests/test_pe_dependencies.sh

      - name: Verify Build Artifacts & Generate Checksums
        run: |
          if [ ! -f "Photo Patch.exe" ] || [ ! -f "dup2patcher.dll" ]; then
            echo "[-] Build artifacts not found!"
            exit 1
          fi
          sha256sum "Photo Patch.exe" dup2patcher.dll > checksums.txt
          echo "[+] Checksums generated:"
          cat checksums.txt

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: PhotoPatch-Build
          path: |
            Photo Patch.exe
            dup2patcher.dll
            checksums.txt
          retention-days: 30

      - name: Extract Quickstart Guide from README
        run: |
          python3 -c '
          import re
          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()
          match = re.search(r"(## 🚀 快速上手\s*[\s\S]*?)(?=\n---\n|\n## |\Z)", content)
          if match:
              with open("release_notes.md", "w", encoding="utf-8") as out:
                  out.write(match.group(1).strip() + "\n")
          else:
              with open("release_notes.md", "w", encoding="utf-8") as out:
                  out.write("## 🚀 快速上手\n\n请查阅项目主页 README.md 获取使用指南。\n")
          '

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            Photo Patch.exe
            dup2patcher.dll
            checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
