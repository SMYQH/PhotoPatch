name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install MinGW-w64 Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64

      - name: Build Project
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify Build Artifacts & Generate Checksums
        run: |
          if [ ! -f "Photo Patch.exe" ] || [ ! -f "dup2patcher.dll" ]; then
            echo "[-] Build artifacts not found!"
            exit 1
          fi
          sha256sum "Photo Patch.exe" dup2patcher.dll > checksums.txt
          echo "[+] Checksums generated:"
          cat checksums.txt

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: PhotoPatch-Build
          path: |
            Photo Patch.exe
            dup2patcher.dll
            checksums.txt
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Photo Patch.exe
            dup2patcher.dll
            checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
